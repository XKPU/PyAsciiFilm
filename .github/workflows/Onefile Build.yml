name: Onefile Build

on:
  workflow_dispatch:
jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-x64-onefile-"
      - shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_x64.exe" `
            --output-dir=dist `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64-onefile
          path: dist/PyAsciiFilm-*-windows_x64.exe
          compression-level: 9

  build-windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard
      - run: pip install -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-onefile-"
      - name: Build with Nuitka
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_arm64.exe" `
            --output-dir=dist `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64-onefile
          path: dist/PyAsciiFilm-*-windows_arm64.exe
          compression-level: 9

  build-linux-x64:
    runs-on: ubuntu-latest
    # ubuntu-latest=24.04(glibc 2.39) 会让产物要求 GLIBC_2.38，老机器直接拒绝启动。
    # 固定 manylinux_2_28，把底线降到 glibc 2.28。
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      # 用镜像自带解释器：Nuitka 会打包 libpython，解释器基线即产物基线
      - name: 选择 Python 3.10
        run: echo "/opt/python/cp310-cp310/bin" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: |
          dnf install -y zip
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-x64-onefile-"
      - env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_x64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64-onefile
          path: dist/PyAsciiFilm-*-linux_x64
          compression-level: 9

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    # 同 x64：固定 manylinux_2_28，避免 24.04 的 glibc 2.39 抬高兼容底线
    container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: 选择 Python 3.10
        run: echo "/opt/python/cp310-cp310/bin" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: |
          dnf install -y zip
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-onefile-"
      - env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_arm64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64-onefile
          path: dist/PyAsciiFilm-*-linux_arm64
          compression-level: 9

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-onefile-"
      - env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-macos_arm64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-arm64-onefile
          path: dist/PyAsciiFilm-*-macos_arm64
          compression-level: 9