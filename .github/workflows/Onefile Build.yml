name: Onefile Build

on:
  workflow_dispatch:
jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-windows_x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-windows_x64-onefile-"
      - name: Build onefile
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: pwsh -File build/windows-x64.ps1 -Mode onefile
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows_x64-onefile
          path: dist/onefile/PyAsciiFilm-*-windows_x64.exe
          if-no-files-found: error
          compression-level: 9

  build-windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-windows_arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-windows_arm64-onefile-"
      - name: Build onefile
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: pwsh -File build/windows-arm64.ps1 -Mode onefile
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows_arm64-onefile
          path: dist/onefile/PyAsciiFilm-*-windows_arm64.exe
          if-no-files-found: error
          compression-level: 9

  build-linux-x64:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment
        run: bash build/containers/setup-linux.sh
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-linux_x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-linux_x64-onefile-"
      - name: Build onefile
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: bash build/linux-x64.sh onefile
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux_x64-onefile
          path: dist/onefile/PyAsciiFilm-*-linux_x64
          if-no-files-found: error
          compression-level: 9

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment
        run: bash build/containers/setup-linux.sh
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-linux_arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-linux_arm64-onefile-"
      - name: Build onefile
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: bash build/linux-arm64.sh onefile
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux_arm64-onefile
          path: dist/onefile/PyAsciiFilm-*-linux_arm64
          if-no-files-found: error
          compression-level: 9

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-macos_arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-macos_arm64-onefile-"
      - name: Build onefile
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: bash build/macos-arm64.sh onefile
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos_arm64-onefile
          path: dist/onefile/PyAsciiFilm-*-macos_arm64
          if-no-files-found: error
          compression-level: 9

