name: Build Windows ARM64

on:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard
      - run: pip install -r requirements.txt

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-standalone
          key: "nuitka-${{ runner.os }}-arm64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-standalone-"

      - name: Build with Nuitka (ARM64 cross-compile)
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-standalone"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --standalone `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_arm64.exe" `
            --output-dir=dist `
            --lto=yes `
            --target-arch=arm64 `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py

      - name: Package
        shell: pwsh
        run: |
          $distFolder = Get-ChildItem -Path dist -Directory -Filter "*.dist" | Select-Object -First 1
          7z a -tzip -mx=9 "dist/$($distFolder.Name).zip" "$($distFolder.FullName)\*"

      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: dist/*.dist.zip
          compression-level: 9