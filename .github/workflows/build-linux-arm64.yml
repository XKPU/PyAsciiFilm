name: Build Linux ARM64

on:
  workflow_dispatch:
jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    # 同 x64：构建机 glibc 就是兼容底线。ubuntu-24.04-arm 是 glibc 2.39，
    # 产物会要求 GLIBC_2.38；固定到 manylinux_2_28 降到 glibc 2.28。
    container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      # 同 x64：用镜像自带的 cp310，保证 libpython 的 glibc 底线与镜像一致
      - name: 选择 Python 3.10
        run: |
          echo "/opt/python/cp310-cp310/bin" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: |
          # manylinux 镜像不含 zip，打包步骤要用到，这里装一次
          dnf install -y zip
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: nuitka-cache-standalone
          key: "nuitka-${{ runner.os }}-arm64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-standalone-"
      - run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --standalone \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_arm64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-standalone"
      - run: |
          distFolder=$(find dist -maxdepth 1 -type d -name "*.dist" | head -1)
          if [ -n "$distFolder" ]; then
            zip -9 "dist/$(basename $distFolder).zip" -r "$distFolder"/*
          else
            echo "::error::Build failed: no .dist folder found in dist/"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: dist/*.dist.zip
          compression-level: 9