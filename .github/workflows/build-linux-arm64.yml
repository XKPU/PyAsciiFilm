name: Build Linux arm64

on:
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: bash build/containers/setup-linux.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt

      - name: Cache Nuitka (standalone)
        uses: actions/cache@v4
        with:
          path: nuitka-cache-standalone
          key: "nuitka-linux_arm64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-linux_arm64-standalone-"

      - name: Build standalone
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-standalone"
        run: bash build/linux-arm64.sh standalone

      - name: Cache Nuitka (onefile)
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-linux_arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-linux_arm64-onefile-"

      - name: Build onefile
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: bash build/linux-arm64.sh onefile

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: dist/standalone/PyAsciiFilm-*.tar.gz
          if-no-files-found: error
          compression-level: 9

      - name: Upload onefile binary
        uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64-onefile
          path: dist/onefile/PyAsciiFilm-*-linux_arm64
          if-no-files-found: error
          compression-level: 9
