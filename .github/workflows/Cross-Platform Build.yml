name: Cross-Platform Build

on:
  workflow_dispatch:
jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt

      - name: Cache Nuitka (standalone)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-standalone
          key: "nuitka-${{ runner.os }}-x64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-x64-standalone-"

      - name: Build standalone
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-standalone"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --standalone `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_x64.exe" `
            --output-dir=dist/standalone `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py

      - name: Package standalone to zip
        shell: pwsh
        run: |
          $distFolder = Get-ChildItem -Path dist/standalone -Directory -Filter "*.dist" | Select-Object -First 1
          if ($distFolder) {
            7z a -tzip -mx=9 "dist/standalone/$($distFolder.Name).zip" "$($distFolder.FullName)\*"
          } else {
            Write-Error "Build failed: no .dist folder found in dist/standalone/"
            exit 1
          }

      - name: Cache Nuitka (onefile)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-x64-onefile-"

      - name: Build onefile
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_x64.exe" `
            --output-dir=dist/onefile `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: dist/standalone/*.dist.zip
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64-onefile
          path: dist/onefile/PyAsciiFilm-*-windows_x64.exe
          compression-level: 9

  build-windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard
      - run: pip install -r requirements.txt

      - name: Cache Nuitka (standalone)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-standalone
          key: "nuitka-${{ runner.os }}-arm64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-standalone-"

      - name: Build with Nuitka (standalone)
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-standalone"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --standalone `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_arm64.exe" `
            --output-dir=dist/standalone `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py

      - name: Package standalone to zip
        shell: pwsh
        run: |
          $distFolder = Get-ChildItem -Path dist/standalone -Directory -Filter "*.dist" | Select-Object -First 1
          7z a -tzip -mx=9 "dist/standalone/$($distFolder.Name).zip" "$($distFolder.FullName)\*"

      - name: Cache Nuitka (onefile)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-arm64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-arm64-onefile-"

      - name: Build with Nuitka (onefile)
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --onefile `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_arm64.exe" `
            --output-dir=dist/onefile `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: dist/standalone/*.dist.zip
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64-onefile
          path: dist/onefile/PyAsciiFilm-*-windows_arm64.exe
          compression-level: 9

  build-linux-x64:
    runs-on: ubuntu-latest
    # 固定 manylinux_2_28：构建机 glibc 即产物兼容底线，ubuntu-latest(24.04/2.39)
    # 会让产物要求 GLIBC_2.38；manylinux_2_28 把底线降到 glibc 2.28。
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      # 用镜像自带解释器：Nuitka 会打包 libpython，解释器基线即产物基线
      - name: 选择 Python 3.10
        run: echo "/opt/python/cp310-cp310/bin" >> "$GITHUB_PATH"
      - name: 安装依赖
        run: |
          dnf install -y zip
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt

      - name: Cache Nuitka (standalone)
        uses: actions/cache@v4
        with:
          path: nuitka-cache-standalone
          key: "nuitka-${{ runner.os }}-x64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-x64-standalone-"

      - name: Build standalone
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-standalone"
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --standalone \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_x64" \
            --output-dir=dist/standalone \
            --lto=yes \
            src/main.py

      - name: Package standalone to zip
        run: |
          distFolder=$(find dist/standalone -maxdepth 1 -type d -name "*.dist" | head -1)
          if [ -n "$distFolder" ]; then
            zip -9 "dist/standalone/$(basename $distFolder).zip" -r "$distFolder"/*
          else
            echo "::error::Build failed: no .dist folder found in dist/standalone/"
            exit 1
          fi

      - name: Cache Nuitka (onefile)
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-${{ runner.os }}-x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ runner.os }}-x64-onefile-"

      - name: Build onefile
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_x64" \
            --output-dir=dist/onefile \
            --lto=yes \
            src/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: dist/standalone/*.dist.zip
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64-onefile
          path: dist/onefile/PyAsciiFilm-*-linux_x64
          compression-level: 9

