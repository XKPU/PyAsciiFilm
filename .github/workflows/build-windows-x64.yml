name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: standalone
        type: choice
        options: [standalone, onefile]

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-${{ inputs.mode }}
          key: "nuitka-windows_x64-${{ inputs.mode }}-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-windows_x64-${{ inputs.mode }}-"

      - name: Build
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-${{ inputs.mode }}"
        run: pwsh -File build/windows-x64.ps1 -Mode ${{ inputs.mode }}

      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64${{ inputs.mode == 'onefile' && '-onefile' || '' }}
          path: |
            dist/standalone/*.dist.zip
            dist/onefile/PyAsciiFilm-*-windows_x64.exe
          if-no-files-found: error
          compression-level: 9
