name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt

      - name: Cache Nuitka (standalone)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-standalone
          key: "nuitka-windows_x64-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-windows_x64-standalone-"

      - name: Build standalone
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-standalone"
        run: pwsh -File build/windows-x64.ps1 -Mode standalone

      - name: Cache Nuitka (onefile)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache-onefile
          key: "nuitka-windows_x64-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-windows_x64-onefile-"

      - name: Build onefile
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: "${{ runner.temp }}/nuitka-cache-onefile"
        run: pwsh -File build/windows-x64.ps1 -Mode onefile

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: dist/standalone/PyAsciiFilm-*.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload onefile binary
        uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64-onefile
          path: dist/onefile/PyAsciiFilm-*-windows_x64.exe
          if-no-files-found: error
          compression-level: 9
