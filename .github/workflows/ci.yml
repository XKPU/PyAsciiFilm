# GitHub Actions 跨平台构建流水线

name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: pyoxidizer.exe
          key: pyoxidizer-win-x64-0.24.0
      - run: |
          if (!(Test-Path pyoxidizer.exe)) {
            Invoke-WebRequest -Uri "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F0.24.0/pyoxidizer-0.24.0-x86_64-pc-windows-msvc.zip" -OutFile pyoxidizer.zip -UseBasicParsing
            Expand-Archive pyoxidizer.zip -DestinationPath pyoxidizer-extract -Force
            Copy-Item pyoxidizer-extract\pyoxidizer.exe . -Force
            Remove-Item pyoxidizer.zip -Force
            Remove-Item pyoxidizer-extract -Recurse -Force
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: .\pyoxidizer.exe build --target-triple x86_64-pc-windows-msvc
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: PyAsciiFilm-v*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: pyoxidizer.exe
          key: pyoxidizer-win-x64-0.24.0
      - run: |
          if (!(Test-Path pyoxidizer.exe)) {
            Invoke-WebRequest -Uri "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F0.24.0/pyoxidizer-0.24.0-x86_64-pc-windows-msvc.zip" -OutFile pyoxidizer.zip -UseBasicParsing
            Expand-Archive pyoxidizer.zip -DestinationPath pyoxidizer-extract -Force
            Copy-Item pyoxidizer-extract\pyoxidizer.exe . -Force
            Remove-Item pyoxidizer.zip -Force
            Remove-Item pyoxidizer-extract -Recurse -Force
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: .\pyoxidizer.exe build --target-triple aarch64-pc-windows-msvc
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: PyAsciiFilm-v*.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: pyoxidizer
          key: pyoxidizer-linux-x64-0.24.0
      - run: |
          if [ ! -f pyoxidizer ]; then
            curl -sSfL "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F0.24.0/pyoxidizer-0.24.0-x86_64-unknown-linux-gnu.tar.gz" -o pyoxidizer.tar.gz
            tar xzf pyoxidizer.tar.gz --strip-components=1 pyoxidizer-0.24.0-x86_64-unknown-linux-gnu/pyoxidizer
            chmod +x pyoxidizer
            rm pyoxidizer.tar.gz
          fi
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-pip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: ./pyoxidizer build --target-triple x86_64-unknown-linux-gnu
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: PyAsciiFilm-v*

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: pyoxidizer
          key: pyoxidizer-linux-x64-0.24.0
      - run: |
          if [ ! -f pyoxidizer ]; then
            curl -sSfL "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F0.24.0/pyoxidizer-0.24.0-x86_64-unknown-linux-gnu.tar.gz" -o pyoxidizer.tar.gz
            tar xzf pyoxidizer.tar.gz --strip-components=1 pyoxidizer-0.24.0-x86_64-unknown-linux-gnu/pyoxidizer
            chmod +x pyoxidizer
            rm pyoxidizer.tar.gz
          fi
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-pip qemu-user-static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: ./pyoxidizer build --target-triple aarch64-unknown-linux-gnu
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: PyAsciiFilm-v*

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: pyoxidizer
          key: pyoxidizer-macos-x64-0.24.0
      - run: |
          if [ ! -f pyoxidizer ]; then
            curl -sSfL "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F0.24.0/pyoxidizer-0.24.0-x86_64-apple-darwin.tar.gz" -o pyoxidizer.tar.gz
            tar xzf pyoxidizer.tar.gz --strip-components=1 pyoxidizer-0.24.0-x86_64-apple-darwin/pyoxidizer
            chmod +x pyoxidizer
            rm pyoxidizer.tar.gz
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: ./pyoxidizer build --target-triple x86_64-apple-darwin
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-x64
          path: PyAsciiFilm-v*

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: pyoxidizer
          key: pyoxidizer-macos-arm64-0.24.0
      - run: |
          if [ ! -f pyoxidizer ]; then
            curl -sSfL "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F0.24.0/pyoxidizer-0.24.0-aarch64-apple-darwin.tar.gz" -o pyoxidizer.tar.gz
            tar xzf pyoxidizer.tar.gz --strip-components=1 pyoxidizer-0.24.0-aarch64-apple-darwin/pyoxidizer
            chmod +x pyoxidizer
            rm pyoxidizer.tar.gz
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: ./pyoxidizer build --target-triple aarch64-apple-darwin
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-arm64
          path: PyAsciiFilm-v*
