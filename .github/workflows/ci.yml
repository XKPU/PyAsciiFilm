# GitHub Actions 跨平台构建流水线

name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/pyoxidizer.exe
          key: cargo-win-x64-pyoxidizer-0.24.0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo install pyoxidizer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pyoxidizer build --target-triple x86_64-pc-windows-msvc
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: PyAsciiFilm-v*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/pyoxidizer.exe
          key: cargo-win-arm64-pyoxidizer-0.24.0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - run: cargo install pyoxidizer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pyoxidizer build --target-triple aarch64-pc-windows-msvc
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: PyAsciiFilm-v*.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/pyoxidizer
          key: cargo-linux-x64-pyoxidizer-0.24.0
      - run: cargo install pyoxidizer
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-pip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: pyoxidizer build --target-triple x86_64-unknown-linux-gnu
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: PyAsciiFilm-v*

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/pyoxidizer
          key: cargo-linux-arm64-pyoxidizer-0.24.0
      - run: cargo install pyoxidizer
      - run: sudo apt-get update && sudo apt-get install -y python3 python3-pip qemu-user-static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: pyoxidizer build --target-triple aarch64-unknown-linux-gnu
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: PyAsciiFilm-v*

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/pyoxidizer
          key: cargo-macos-x64-pyoxidizer-0.24.0
      - run: cargo install pyoxidizer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: pyoxidizer build --target-triple x86_64-apple-darwin
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-x64
          path: PyAsciiFilm-v*

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/pyoxidizer
          key: cargo-macos-arm64-pyoxidizer-0.24.0
      - run: cargo install pyoxidizer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip3 install -r requirements.txt
      - run: pyoxidizer build --target-triple aarch64-apple-darwin
        env:
          PYOXIDIZER_CONFIG: ${{ github.workspace }}/pyoxidizer.toml
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-arm64
          path: PyAsciiFilm-v*
