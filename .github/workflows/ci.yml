name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - shell: pwsh
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --onefile `
            --standalone `
            --follow-imports `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_x64.exe" `
            --output-dir=dist `
            --lto=yes `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: dist/*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - shell: pwsh
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --onefile `
            --standalone `
            --follow-imports `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_arm64.exe" `
            --output-dir=dist `
            --lto=yes `
            --target-arch=arm64 `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: dist/*.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --standalone \
            --follow-imports \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_x64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: dist/PyAsciiFilm-*

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --standalone \
            --follow-imports \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_arm64" \
            --output-dir=dist \
            --lto=yes \
            --target-arch=aarch64 \
            src/main.py
        env:
          CC: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: dist/PyAsciiFilm-*

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --standalone \
            --follow-imports \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-macos_x64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-x64
          path: dist/PyAsciiFilm-*

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --onefile \
            --standalone \
            --follow-imports \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-macos_arm64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-arm64
          path: dist/PyAsciiFilm-*
