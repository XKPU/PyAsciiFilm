# GitHub Actions 跨平台构建流水线

name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: choco install windows-sdk-10.0 -y
      - run: cargo install pyoxidizer
      - run: |
          pip install -r requirements.txt
          pyoxidizer build --target-triple x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: PyAsciiFilm-v*.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: choco install windows-sdk-10.0 -y
      - run: cargo install pyoxidizer
      - run: |
          pip install -r requirements.txt
          pyoxidizer build --target-triple aarch64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: PyAsciiFilm-v*.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo install pyoxidizer
      - run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip3 install -r requirements.txt
          pyoxidizer build --target-triple x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: PyAsciiFilm-v*

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo install pyoxidizer
      - run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip qemu-user-static
          pip3 install -r requirements.txt
          pyoxidizer build --target-triple aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: PyAsciiFilm-v*

  build-macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cargo install pyoxidizer
      - run: |
          pip3 install -r requirements.txt
          pyoxidizer build --target-triple x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-x64
          path: PyAsciiFilm-v*

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo install pyoxidizer
      - run: |
          pip3 install -r requirements.txt
          pyoxidizer build --target-triple aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-arm64
          path: PyAsciiFilm-v*
