# GitHub Actions 跨平台编译流水线
# 使用 Nuitka 将 Python 编译为原生机器码（Python → C → 机器码）

name: Cross-Platform Build

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          nuitka --standalone --onefile `
            --lto=yes `
            --output-filename=PyAsciiFilm.exe `
            --output-dir=dist `
            --include-data-files=setting.json=setting.json `
            --include-data-files=LICENSE=LICENSE `
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-x64
          path: dist/PyAsciiFilm.exe

  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          nuitka --standalone --onefile `
            --lto=yes `
            --output-filename=PyAsciiFilm.exe `
            --output-dir=dist `
            --target-arch=arm64 `
            --include-data-files=setting.json=setting.json `
            --include-data-files=LICENSE=LICENSE `
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: dist/PyAsciiFilm.exe

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          nuitka --standalone --onefile \
            --lto=yes \
            --output-filename=PyAsciiFilm \
            --output-dir=dist \
            --include-data-files=setting.json=setting.json \
            --include-data-files=LICENSE=LICENSE \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: dist/PyAsciiFilm

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          nuitka --standalone --onefile \
            --lto=yes \
            --output-filename=PyAsciiFilm \
            --output-dir=dist \
            --target-arch=aarch64 \
            --target-os=linux \
            --include-data-files=setting.json=setting.json \
            --include-data-files=LICENSE=LICENSE \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-arm64
          path: dist/PyAsciiFilm

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          nuitka --standalone --onefile \
            --lto=yes \
            --output-filename=PyAsciiFilm \
            --output-dir=dist \
            --include-data-files=setting.json=setting.json \
            --include-data-files=LICENSE=LICENSE \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-x64
          path: dist/PyAsciiFilm

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install nuitka ordered-set zstandard -r requirements.txt
      - run: |
          nuitka --standalone --onefile \
            --lto=yes \
            --output-filename=PyAsciiFilm \
            --output-dir=dist \
            --include-data-files=setting.json=setting.json \
            --include-data-files=LICENSE=LICENSE \
            src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-macos-arm64
          path: dist/PyAsciiFilm
