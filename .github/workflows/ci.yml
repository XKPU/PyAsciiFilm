      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-arm64-${{ hashFiles('requirements.txt', 'src/**/*.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-arm64-
      - shell: pwsh
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          $VERSION = Get-Content version.txt -Raw
          $VERSION = $VERSION.Trim()
          python -m nuitka `
            --standalone `
            --follow-imports `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --include-package=textual `
            --include-package=rich._unicode_data `
            --include-package=imageio_ffmpeg `
            --include-module=miniaudio `
            --output-filename="PyAsciiFilm-v${VERSION}-windows_arm64.exe" `
            --output-dir=dist `
            --lto=yes `
            --target-arch=arm64 `
            --windows-company-name=K_PU `
            --windows-product-name=PyAsciiFilm `
            --windows-file-version=$VERSION `
            --windows-product-version=$VERSION `
            src/main.py
      - shell: pwsh
        run: |
          $distFolder = Get-ChildItem -Path dist -Directory -Filter "*.dist" | Select-Object -First 1
          if ($distFolder) {
            7z a -tzip -mx=9 "dist/$($distFolder.Name).zip" "$($distFolder.FullName)\*"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-windows-arm64
          path: dist/*.dist.zip
          compression-level: 0

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-x64-${{ hashFiles('requirements.txt', 'src/**/*.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-x64-
      - run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          python -m nuitka \
            --standalone \
            --follow-imports \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=textual \
            --include-package=rich._unicode_data \
            --include-package=imageio_ffmpeg \
            --include-module=miniaudio \
            --output-filename="PyAsciiFilm-v${VERSION}-linux_x64" \
            --output-dir=dist \
            --lto=yes \
            src/main.py
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
      - run: |
          distFolder=$(find dist -maxdepth 1 -type d -name "*.dist" | head -1)
          if [ -n "$distFolder" ]; then
            zip -9 "dist/$(basename $distFolder).zip" -r "$distFolder"/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-linux-x64
          path: dist/*.dist.zip
          compression-level: 0

