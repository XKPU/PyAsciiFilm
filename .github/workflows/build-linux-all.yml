name: Build Linux (All)

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
            suffix: linux_x64
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
            suffix: linux_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        run: bash build/containers/setup-linux.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.3.7" ordered-set zstandard -r requirements.txt

      - name: Cache Nuitka (standalone)
        uses: actions/cache@v4
        with:
          path: nuitka-cache-standalone
          key: "nuitka-${{ matrix.suffix }}-standalone-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ matrix.suffix }}-standalone-"

      - name: Build standalone
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-standalone"
        run: bash build/linux-${{ matrix.suffix == 'linux_x64' && 'x64' || 'arm64' }}.sh standalone

      - name: Cache Nuitka (onefile)
        uses: actions/cache@v4
        with:
          path: nuitka-cache-onefile
          key: "nuitka-${{ matrix.suffix }}-onefile-${{ hashFiles('requirements.txt', 'src/**/*.py') }}"
          restore-keys: |
            "nuitka-${{ matrix.suffix }}-onefile-"

      - name: Build onefile
        env:
          NUITKA_CACHE_DIR: "nuitka-cache-onefile"
        run: bash build/linux-${{ matrix.suffix == 'linux_x64' && 'x64' || 'arm64' }}.sh onefile

      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-${{ matrix.suffix }}
          path: dist/standalone/PyAsciiFilm-*.tar.gz
          if-no-files-found: error
          compression-level: 9
      - uses: actions/upload-artifact@v4
        with:
          name: pyasciifilm-${{ matrix.suffix }}-onefile
          path: dist/onefile/PyAsciiFilm-*-${{ matrix.suffix }}
          if-no-files-found: error
          compression-level: 9
