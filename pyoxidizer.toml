# PyOxidizer 构建配置
# 跨平台、跨架构构建
#
# ⚠️ 注意：此文件为 Starlark 语法，不是标准 TOML
#   - 标识符中不能使用连字符（-），必须用下划线（_）
#   - 例如 python_version，不是 python-version

[package]
name = "pyasciifilm"
version = "3.0.2"
description = "将视频实时转换为 ASCII 字符画并在终端播放的创意工具"
authors = ["XKPU"]

# 入口模块
[package-source]
path = "src"
main = "main.py"

# 资源文件
[[resources]]
type = "file"
path = "setting.json"
install = true

[[resources]]
type = "file"
path = "LICENSE"
install = true

# Python 依赖（从 requirements.txt 读取）
[[distributions]]
name = "pyasciifilm-deps"
path = "requirements.txt"

# 全局构建设置
[settings]
lto = true
opt_level = 3
compress = true
include_stdlib = true

# Python 版本（全局）
[python_distribution]
python_version = "3.10"
