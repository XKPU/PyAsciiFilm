# PyOxidizer 构建配置
# 注意：此文件是 Starlark 语法，不是标准 TOML
#   - 标识符中不能使用连字符（-），必须用下划线（_）
#   - section 用方括号括起是合法的 PyOxidizer 配置语法

# 应用程序名称（顶级变量）
application_name = "pyasciifilm"
application_version = "3.0.2"
python_path = "."

# Python 运行时分发
[python_distribution]
python_version = "3.10"

# 打包配置
# requirements.txt 会被自动包含（python_path = "." 指定源码目录）

# 资源文件（注意是 [[resource]] 单数，不是 [[resources]]）
[[resource]]
type = "file"
path = "setting.json"
install = true

[[resource]]
type = "file"
path = "LICENSE"
install = true

# 构建目标（三方平台由 build --target-triple 指定，此处不需要）

